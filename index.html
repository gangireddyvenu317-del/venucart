<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f6fb}
.top{background:linear-gradient(135deg,#0a1a4a,#0e4a8a);color:#fff;padding:20px 15px 25px;border-radius:0 0 25px 25px}
.top h1{margin:0;font-size:32px}.top h1 span{color:#ffb703}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 20px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:150px;object-fit:cover}
.card div{padding:12px}.card h3{margin:0;font-size:17px}.card p{margin:5px 0;color:#666;font-size:13px}
.card button{width:100%;background:#0a2a6b;color:#fff;border:0;padding:11px;border-radius:10px;font-weight:800}

</head>
<body>
<div class="top">
